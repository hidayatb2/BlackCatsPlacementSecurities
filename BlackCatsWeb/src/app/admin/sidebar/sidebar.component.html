
<!-- sidebar.component.html -->
<div class="w-64 h-screen flex flex-col bg-gray-900 text-white shadow-2xl">
  <!-- Logo Section -->
  <div class="p-6 text-center border-b border-gray-700">
    <img src="https://flowbite.com/docs/images/logo.svg" alt="Logo" class="w-12 h-12 mx-auto">
    <span class="text-lg font-bold mt-2 block text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">Blackcats Security</span>
  </div>

  <!-- Navigation Links -->
  <ul class="flex-1 mt-6 px-4 space-y-2">
    <li>
      <a routerLink="/admin/dashboard" class="sidebar-link flex items-center p-4 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800 transition-colors">
        <i class="fas fa-tachometer-alt text-xl mr-3"></i>
        <span class="link_name">Dashboard</span>
      </a>
    </li>
    <li>
      <a routerLink="/admin/users" class="sidebar-link flex items-center p-4 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800 transition-colors">
        <i class="fas fa-users text-xl mr-3"></i>
        <span class="link_name">Users</span>
      </a>
    </li>
    <li>
      <a routerLink="/analytics" class="sidebar-link flex items-center p-4 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800 transition-colors">
        <i class="fas fa-chart-pie text-xl mr-3"></i>
        <span class="link_name">Analytics</span>
      </a>
    </li>
    <li>
      <a routerLink="/settings" class="sidebar-link flex items-center p-4 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800 transition-colors">
        <i class="fas fa-cog text-xl mr-3"></i>
        <span class="link_name">Settings</span>
      </a>
    </li>
  </ul>

  <!-- Profile Section -->
  <div class="p-4 bg-gray-800 mt-auto border-t border-gray-700">
    <div class="flex items-center">
      <div class="flex-shrink-0">
        <!-- <img src="https://via.placeholder.com/40" alt="Profile" class="w-10 h-10 rounded-full border-2 border-purple-400"> -->
      </div>
      <div class="ml-3">
        <div class="text-sm font-medium text-white">{{ currentUser.name|uppercase}}</div>
        <div class="text-xs text-gray-400">{{ currentUser.role }}</div>
      </div>
      <button (click)="logout()" class="ml-auto p-2 rounded-lg hover:bg-gray-700 transition-colors">
        <i class="fas fa-sign-out-alt text-xl text-gray-300 hover:text-white"></i>
      </button>
    </div>
  </div>
</div>
