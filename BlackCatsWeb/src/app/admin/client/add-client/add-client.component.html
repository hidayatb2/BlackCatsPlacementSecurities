<button class="btn btn-outline btn-primary" (click)="openModal()">
  Add Client
</button>

<dialog id="my_modal_7" class="modal modal-bottom sm:modal-middle">
  <div class="modal-box max-w-3xl bg-white shadow-xl rounded-lg">
    <!-- Modal Header -->
    <h3 class="text-2xl font-bold text-gray-800 mb-6">Add Client</h3>

    <!-- Modal Body -->
    <div class="modal-action m-2">
      <form #ClientForm="ngForm" method="dialog" class="space-y-4 w-full">
        <!-- Name Field -->
        <div class="flex flex-col space-y-2">
          <label for="name" class="text-sm font-medium text-gray-700"
            >Name</label
          >
          <input
            type="text"
            id="name"
            placeholder="Enter name"
            name="name"
            [(ngModel)]="clientRequest.name"
            class="input input-bordered w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- Email Field -->
        <div class="flex flex-col space-y-2">
          <label for="address" class="text-sm font-medium text-gray-700"
            >Address</label
          >
          <input
            type="address"
            id="address"
            placeholder="Enter Address"
            name="address"
            [(ngModel)]="clientRequest.address"
            class="input input-bordered w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- Contact No Field -->
        <div class="flex flex-col space-y-2">
          <label for="contactNo" class="text-sm font-medium text-gray-700"
            >Contact No</label
          >
          <input
            type="text"
            id="contactNo"
            placeholder="Enter contact number"
            name="contactNo"
            [(ngModel)]="clientRequest.contactNo"
            class="input input-bordered w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div class="flex flex-col space-y-2">
          <label for="agreementDate" class="text-sm font-medium text-gray-700"
            >Agreement Date</label
          >
          <input
            type="date"
            id="agreementDate"
            placeholder="Enter Date"
            name="agreementDate"
            [(ngModel)]="clientRequest.agreementDate"
            class="input input-bordered w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div class="flex flex-col space-y-2">
            <label for="securityDeposit" class="text-sm font-medium text-gray-700"
              >Security Deposit</label
            >
            <input
              type="text"
              id="securityDeposit"
              placeholder="Enter Deposit"
              name="securityDeposit"
              [(ngModel)]="clientRequest.securityDeposit"
              class="input input-bordered w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div class="flex flex-col space-y-2">
            <label for="fileUpload" class="text-sm font-medium text-gray-700"
              >Upload Document</label
            >
            <input
              type="file"
              id="fileUpload"
              name="fileUpload"
              class="file-input file-input-bordered w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

        <!-- Buttons -->
        <div class="flex justify-end space-x-4 mt-6">
          <button
            type="button"
            class="btn btn-ghost text-gray-600 hover:bg-gray-100"
            (click)="closeModal()"
          >
            Close
          </button>
          <button
            type="submit"
            class="btn btn-primary bg-blue-500 text-white hover:bg-blue-600"
            (click)="addClient()"
          >
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>
</dialog>
