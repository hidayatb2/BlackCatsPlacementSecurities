<button class="btn btn-outline btn-primary" (click)="openModal()">
  Add User
</button>

<dialog id="my_modal_5" class="modal modal-bottom sm:modal-middle">
  <div class="modal-box max-w-3xl bg-white shadow-xl rounded-lg">
    <!-- Modal Header -->
    <h3 class="text-2xl font-bold text-gray-800 mb-6">Add User</h3>

    <!-- Modal Body -->
    <div class="modal-action m-2">
      <form #UserForm="ngForm" method="dialog" class="space-y-4 w-full">
        <!-- Name Field -->
        <div class="flex flex-col space-y-2">
          <label for="name" class="text-sm font-medium text-gray-700"
            >Name</label
          >
          <input
            type="text"
            id="name"
            placeholder="Enter name"
            name="name"
            [(ngModel)]="addUserRequest.name"
            class="input input-bordered w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- Email Field -->
        <div class="flex flex-col space-y-2">
          <label for="email" class="text-sm font-medium text-gray-700"
            >Email</label
          >
          <input
            type="email"
            id="email"
            placeholder="Enter email"
            name="email"
            [(ngModel)]="addUserRequest.email"
            class="input input-bordered w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- Contact No Field -->
        <div class="flex flex-col space-y-2">
          <label for="contactNo" class="text-sm font-medium text-gray-700"
            >Contact No</label
          >
          <input
            type="text"
            id="contactNo"
            placeholder="Enter contact number"
            name="contactNo"
            [(ngModel)]="addUserRequest.contactNo"
            class="input input-bordered w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- User Role Dropdown -->
        <div class="flex flex-col space-y-2">
          <label for="userRole" class="text-sm font-medium text-gray-700"
            >User Role</label
          >
          <select
            id="userRole"
            name="userRole"
            [(ngModel)]="addUserRequest.userRole"
            class="select select-bordered w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="1">Admin</option>
            <option value="2">Manager</option>
            <option value="3">Staff</option>
          </select>
        </div>

        <!-- Buttons -->
        <div class="flex justify-end space-x-4 mt-6">
          <button
            type="button"
            class="btn btn-ghost text-gray-600 hover:bg-gray-100"
            (click)="closeModal()"
          >
            Close
          </button>
          <button
            type="submit"
            class="btn btn-primary bg-blue-500 text-white hover:bg-blue-600"
            (click)="addUser()"
          >
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>
</dialog>
